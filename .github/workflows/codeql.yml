name: CodeQL

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Analyze C/C++
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf build-essential cmake doxygen gettext imagemagick meson ninja-build patch pkg-config xz-utils \
            libgdk-pixbuf2.0-bin librsvg2-common libgtk-3-dev libcanberra-dev libcairo2-dev libpango1.0-dev \
            libfontconfig1-dev libepoxy-dev libibus-1.0-dev libwayland-dev libgl-dev libegl-dev \
            libx11-dev libxext-dev libxfixes-dev libxkbcommon-dev liburing-dev libudev-dev libsystemd-dev \
            libssh-dev libnfs-dev libcurl4-openssl-dev libssl-dev libxml2-dev libtasn1-6-dev libtasn1-bin
          npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: c-cpp
          build-mode: manual
          queries: ./deps/cardio/.github/codeql/cardio.qls

      - name: Build the applications and shared libraries
        env:
          CCACHE_DISABLE: '1'
        run: |
          meson setup .build -Dbuild_tests=false
          meson compile -C .build -j 2

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:c-cpp

  scripts:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
